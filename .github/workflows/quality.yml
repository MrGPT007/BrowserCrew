name: quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check

  browser-smoke:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run installed-extension smoke test
        run: npm run browser-smoke
      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: artifacts/browser-smoke
          if-no-files-found: warn
