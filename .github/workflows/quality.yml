name: quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check

  browser-smoke:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run v0.1 installed-extension smoke test
        run: npm run browser-smoke
      - name: Run W2 directory installed-extension smoke test
        run: npm run directory-smoke
      - name: Run W4 record-update installed-extension smoke test
        run: npm run record-smoke
      - name: Run W5 invoice-download installed-extension smoke test
        run: npm run invoice-smoke
      - name: Run seeded privacy installed-extension smoke test
        run: npm run privacy-smoke
      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: artifacts
          if-no-files-found: warn
