name: quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check

  release-matrix:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run V02-B01 75-attempt release matrix
        run: npm run release-matrix-smoke
      - name: Upload V02-B01 release-matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-matrix-evidence
          path: artifacts/release-matrix
          if-no-files-found: error

  browser-smoke:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts
      - name: Build deterministic v0.2 release candidate
        run: npm run package-release
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify installed release package candidate
        run: npm run package-smoke
      - name: Verify clean rollback to previous known-good source
        run: npm run package-rollback-smoke
      - name: Generate V02-B08 Chrome Web Store screenshot evidence
        run: npm run store-media-smoke
      - name: Upload Chrome Web Store media evidence
        uses: actions/upload-artifact@v4
        with:
          name: store-media-evidence
          path: artifacts/store-media
          if-no-files-found: error
      - name: Run post-v0.2 Watch Me installed-extension smoke test
        run: npm run watch-me-smoke
      - name: Upload Watch Me evidence
        uses: actions/upload-artifact@v4
        with:
          name: watch-me-evidence
          path: artifacts/watch-me-smoke
          if-no-files-found: error
      - name: Run post-v0.2 Watch Me recorder resilience installed-extension smoke test
        run: npm run watch-me-resilience-smoke
      - name: Upload Watch Me recorder resilience evidence
        uses: actions/upload-artifact@v4
        with:
          name: watch-me-resilience-evidence
          path: artifacts/watch-me-resilience-smoke
          if-no-files-found: error
      - name: Run post-v0.2 Skill draft review installed-extension smoke test
        run: npm run skill-draft-review-smoke
      - name: Upload Skill draft review evidence
        uses: actions/upload-artifact@v4
        with:
          name: skill-draft-review-evidence
          path: artifacts/skill-draft-review-smoke
          if-no-files-found: error
      - name: Run post-v0.2 Skill library lifecycle installed-extension smoke test
        run: npm run skill-library-lifecycle-smoke
      - name: Upload Skill library lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: skill-library-lifecycle-evidence
          path: artifacts/skill-library-lifecycle-smoke
          if-no-files-found: error
      - name: Run post-v0.2 safe Skill import/export installed-extension smoke test
        run: npm run skill-portable-smoke
      - name: Upload safe Skill import/export evidence
        uses: actions/upload-artifact@v4
        with:
          name: skill-portable-evidence
          path: artifacts/skill-portable-smoke
          if-no-files-found: error
      - name: Run post-v0.2 Skill Versions/Test/Run installed-extension smoke test
        run: npm run skill-run-ui-smoke
      - name: Upload Skill Versions/Test/Run evidence
        uses: actions/upload-artifact@v4
        with:
          name: skill-run-ui-evidence
          path: artifacts/skill-run-ui-smoke
          if-no-files-found: error
      - name: Run post-v0.2 missed schedule review installed-extension smoke test
        run: npm run schedule-review-smoke
      - name: Upload missed schedule review evidence
        uses: actions/upload-artifact@v4
        with:
          name: schedule-review-evidence
          path: artifacts/schedule-review-smoke
          if-no-files-found: error
      - name: Run post-v0.2 prepared schedule setup installed-extension smoke test
        run: npm run schedule-setup-smoke
      - name: Upload prepared schedule setup evidence
        uses: actions/upload-artifact@v4
        with:
          name: schedule-setup-evidence
          path: artifacts/schedule-setup-smoke
          if-no-files-found: error
      - name: Run post-v0.2 scheduled task Stop/Pause installed-extension smoke test
        run: npm run schedule-control-smoke
      - name: Upload scheduled task Stop/Pause evidence
        uses: actions/upload-artifact@v4
        with:
          name: schedule-control-evidence
          path: artifacts/schedule-control-smoke
          if-no-files-found: error
      - name: Run v0.1 installed-extension smoke test
        run: npm run browser-smoke
      - name: Run V02-B01 W1/W3 adversarial installed-extension smoke test
        run: npm run w1-w3-adversarial-smoke
      - name: Run V02-B01 W2/W4/W5 adversarial installed-extension smoke test
        run: npm run w2-w4-w5-adversarial-smoke
      - name: Run W2 directory installed-extension smoke test
        run: npm run directory-smoke
      - name: Run W4 record-update installed-extension smoke test
        run: npm run record-smoke
      - name: Run W5 invoice-download installed-extension smoke test
        run: npm run invoice-smoke
      - name: Run seeded privacy installed-extension smoke test
        run: npm run privacy-smoke
      - name: Run v0.2 privacy sink installed-extension smoke test
        run: npm run privacy-sinks-smoke
      - name: Run C1 Chat installed-extension smoke test
        run: npm run chat-smoke
      - name: Run C2 named AI-connection installed-extension smoke test
        run: npm run connections-smoke
      - name: Run C2 document-attachment installed-extension smoke test
        run: npm run attachments-smoke
      - name: Run C3 built-in Chat tool installed-extension smoke test
        run: npm run tools-smoke
      - name: Run V02-B04 Anthropic protocol installed-extension smoke test
        run: npm run anthropic-smoke
      - name: Run V02-B05 accessibility installed-extension smoke test
        run: npm run accessibility-smoke
      - name: Run C4 MCP installed-extension smoke test
        run: npm run mcp-smoke
      - name: Run AGT-01 C5 bounded compare and handoff smoke test
        run: npm run c5-smoke
      - name: Run REL-01 Workspace Stop and Pause smoke test
        run: npm run workspace-stop-smoke
      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: artifacts
          if-no-files-found: warn
      - name: Upload release package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-package-evidence
          path: dist
          if-no-files-found: warn

  previous-stable-chrome:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BROWSERCREW_EXPECT_BROWSER_VERSION: 152.0.7977.75
      BROWSERCREW_BROWSER_EXECUTABLE: ${{ github.workspace }}/.browser/chrome-linux64/chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts
      - name: Build deterministic v0.2 release candidate
        run: npm run package-release
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Download pinned previous-stable Chrome 152
        run: |
          mkdir -p .browser
          curl -fsSL -o .browser/chrome-152.0.7977.75-linux64.zip https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.75/linux64/chrome-linux64.zip
          sha256sum .browser/chrome-152.0.7977.75-linux64.zip
          unzip -q .browser/chrome-152.0.7977.75-linux64.zip -d .browser
          chmod +x "$BROWSERCREW_BROWSER_EXECUTABLE"
          "$BROWSERCREW_BROWSER_EXECUTABLE" --version
      - name: Run V02-B06 previous-stable Chrome 152 compatibility matrix
        run: npm run previous-stable-smoke
      - name: Upload previous-stable Chrome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previous-stable-chrome-evidence
          path: artifacts
          if-no-files-found: error
