name: rel01-apply
on:
  push:
    branches: [fix/workspace-stop-abort]
    paths:
      - scripts/apply-rel01-fix.mjs
      - .github/workflows/rel01-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-stop-abort
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply REL-01 patch
        run: node scripts/apply-rel01-fix.mjs
      - name: Syntax check background worker
        run: node --check src/background.js
      - name: Commit patched worker
        run: |
          if git diff --quiet; then
            echo "No patch changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background.js
          git commit -m "Abort in-flight Workspace AI request on Stop"
          git push origin HEAD:fix/workspace-stop-abort
